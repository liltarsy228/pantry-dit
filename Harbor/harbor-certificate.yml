apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-certificate
  namespace: harbor
spec:
  secretName: harbor-tls
  issuerRef:
    name: vault-cluster-issuer
    kind: ClusterIssuer
  commonName: registry.aitu.lo
  dnsNames:
    - registry.aitu.lo
  usages:
    - digital signature
    - digital signature
    - server auth

