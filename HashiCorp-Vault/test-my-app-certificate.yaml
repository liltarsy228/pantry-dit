apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: my-app-tls
    namespace: default
spec:
    secretName: my-app-tls
    issuerRef:
        name: vault-cluster-issuer
        kind: ClusterIssuer
    duration: 720h
    renewBefore: 360h
    commonName: my-app-test.aitu.lo
    dnsNames:
      - my-app-test.aitu.lo
    
