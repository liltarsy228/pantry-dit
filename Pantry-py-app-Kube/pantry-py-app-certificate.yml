apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pantry-py-app-certificate
  namespace: pantry
spec:
  secretName: pantry-py-app-tls
  issuerRef:
    name: vault-cluster-issuer
    kind: ClusterIssuer
  commonName: pantry.aitu.lo
  dnsNames:
    - pantry.aitu.lo
  usages:
    - digital signature
    - key encipherment
    - server auth

