
apiVersion: acid.zalan.do/v1
kind: postgresql

metadata:
  name: pantry-dit-postgresql-cluster


spec:
  teamId: "acid"

  numberOfInstances: 3

  volume:
    size: 1Gi
    storageClass: local-path

  users:
    it_assets:
      - superuser
      - createdb

  databases:
    it_assets: it_assets

  postgresql:
    version: "16"

